<!DOCTYPE html>
<html>
<head>
    <title>Street Rider</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: none; }
        canvas { display: block; background: #555; margin: 0 auto; cursor: pointer; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: #00ff00; font-size: 24px; pointer-events: none; text-shadow: 2px 2px #000; z-index: 10; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 30; cursor: pointer; text-align: center; }
        #loading { position: absolute; top: 50%; width: 100%; text-align: center; color: white; transform: translateY(-50%); z-index: 20; }
        .start-btn { background: #00ff00; color: black; padding: 20px 50px; border-radius: 50px; font-size: 28px; margin-top: 20px; border: none; font-family: 'Arial Black'; box-shadow: 0 8px #008800; }
    </style>
</head>
<body>
    <div id="loading">LOADING ASSETS...<br><span id="loadProgress">0%</span></div>
    
    <div id="overlay" style="display:none;">
        <h1 style="color:#00ff00; margin:0;">STREET RIDER</h1>
        <p style="margin:10px;">ANDROID AUDIO FIX ENABLED</p>
        <button class="start-btn" id="goButton">START GAME</button>
    </div>

    <div id="ui" style="display:none;">DIST: <span id="score">0</span>m</div>
    <canvas id="gameCanvas" style="display:none;"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const loadingEl = document.getElementById('loading');
const progressEl = document.getElementById('loadProgress');
const overlayEl = document.getElementById('overlay');

canvas.width = window.innerWidth > 500 ? 450 : window.innerWidth;
canvas.height = window.innerHeight;

const repoBase = "https://raw.githubusercontent.com/iordanist-design/my-bike-game/main/";

// --- THE ANDROID AUDIO UNLOCKER ---
const music = new Audio();
music.crossOrigin = "anonymous";
music.src = `${repoBase}BeepBox-Song.mp3`;
music.loop = true;
music.volume = 0.5;

let audioStarted = false;
let gameStarted = false;

// This function "primes" the audio on mobile
function unlockAudio() {
    if (audioStarted) return;
    
    // Play and immediately pause to "unlock" the audio channel
    music.play().then(() => {
        console.log("Audio Unlocked!");
        audioStarted = true;
    }).catch(err => {
        console.log("Waiting for user gesture...");
    });
}

// --- IMAGES ---
const dogSheets = [];
let loadedCount = 0;
const totalSheets = 10;
for (let i = 0; i < totalSheets; i++) {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
        loadedCount++;
        progressEl.innerText = Math.floor((loadedCount / totalSheets) * 100) + "%";
        if (loadedCount === totalSheets) {
            loadingEl.style.display = 'none';
            overlayEl.style.display = 'flex';
        }
    };
    img.src = `${repoBase}Dogs-Remastered-0${i}.png`;
    dogSheets.push(img);
}

// --- GAME STATE ---
let score = 0, gameActive = true, frame = 0, roadY = 0, gameSpeed = 1.0;
const player = { 
    x: canvas.width / 2, y: canvas.height - 150, 
    targetX: canvas.width / 2, targetY: canvas.height - 150, 
    w: 30, h: 60, tilt: 0 
};
const obstacles = [], dogs = [];

function startTheGame() {
    unlockAudio(); // Final attempt to play
    overlayEl.style.display = 'none';
    canvas.style.display = 'block';
    document.getElementById('ui').style.display = 'block';
    gameStarted = true;
    draw();
}

const updateInput = (e) => {
    if (!gameActive || !gameStarted) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    player.targetX = clientX - rect.left;
    player.targetY = clientY - rect.top;
};

// Listeners optimized for Android gesture detection
window.addEventListener('mousemove', updateInput);
window.addEventListener('touchmove', (e) => { e.preventDefault(); updateInput(e); }, { passive: false });

// This "touchstart" on the GO button is the key to Android audio
overlayEl.addEventListener('touchstart', (e) => {
    unlockAudio(); // Trigger audio on the very first touch
}, { passive: true });

window.addEventListener('mousedown', () => { 
    if (!gameStarted) startTheGame(); 
    else if (!gameActive) location.reload(); 
});

window.addEventListener('touchstart', (e) => { 
    if (!gameStarted) { 
        e.preventDefault(); 
        startTheGame(); 
    } else if (!gameActive) { 
        e.preventDefault(); 
        location.reload(); 
    }
}, { passive: false });

function checkCollision(p, o, pad) {
    return p.x < o.x + o.w - pad && p.x + p.w > o.x + pad &&
           p.y < o.y + o.h - pad && p.y + p.h > o.y + pad;
}

function update() {
    if (!gameActive || !gameStarted) return;
    frame++;
    gameSpeed += 0.00001; 
    score += gameSpeed;
    scoreEl.innerText = Math.floor(score/10);

    let prevX = player.x;
    player.x += (player.targetX - player.x) * 0.15;
    player.y += (player.targetY - player.y) * 0.15;
    player.tilt = (player.x - prevX) * 0.07;
    roadY = (roadY + (8 * gameSpeed)) % 100;

    if (frame % Math.max(40, Math.floor(80 / gameSpeed)) === 0) {
        let size = 0.7 + Math.random() * 0.5;
        obstacles.push({ x: Math.random() * (canvas.width - 100) + 20, y: -120, w: 70 * size, h: 40 * size });
    }
    if (frame % Math.max(50, Math.floor(100 / gameSpeed)) === 0) {
        const side = Math.random() < 0.5 ? -150 : canvas.width + 150;
        dogs.push({ x: side, y: Math.random() * (canvas.height * 0.7) + 50, speedX: (side < 0 ? 3.5 : -3.5) * gameSpeed, sheet: dogSheets[Math.floor(Math.random() * totalSheets)], animFrame: 7, animTimer: 0, w: 100, h: 75 });
    }

    obstacles.forEach((o, i) => {
        o.y += (8 * gameSpeed);
        if (o.y > canvas.height) obstacles.splice(i, 1);
        if (checkCollision(player, o, 15)) { gameActive = false; music.pause(); }
    });

    dogs.forEach((d, i) => {
        d.x += d.speedX;
        if (Math.abs(d.x - canvas.width/2) > 1000) dogs.splice(i, 1);
        if (checkCollision(player, d, 20)) { gameActive = false; music.pause(); }
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#555"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.setLineDash([40, 60]); ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(canvas.width/2, roadY - 100); ctx.lineTo(canvas.width/2, canvas.height + roadY); ctx.stroke();

    obstacles.forEach(o => {
        const grad = ctx.createRadialGradient(o.x + o.w/2, o.y + o.h/2, o.w/10, o.x + o.w/2, o.y + o.h/2, o.w/2);
        grad.addColorStop(0, "rgba(20, 20, 20, 1)"); grad.addColorStop(1, "rgba(85, 85, 85, 0)");
        ctx.fillStyle = grad; ctx.beginPath(); ctx.ellipse(o.x+o.w/2, o.y+o.h/2, o.w/2, o.h/2, 0, 0, Math.PI*2); ctx.fill();
    });
    
    dogs.forEach(d => {
        ctx.save(); ctx.translate(d.x, d.y);
        if (d.speedX > 0) ctx.scale(-1, 1); 
        d.animTimer += gameSpeed;
        if (d.animTimer > 4) { d.animFrame--; if (d.animFrame < 0) d.animFrame = 7; d.animTimer = 0; }
        ctx.drawImage(d.sheet, d.animFrame * 65 + 1, 3*48, 65, 48, -d.w/2, -d.h/2, d.w, d.h);
        ctx.restore();
    });
    
    // Bike Design
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt);
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.beginPath(); ctx.ellipse(0, 15, 12, 35, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#e74c3c"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(0, 25); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, 5, 10, 15, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(0, -12, 8, 0, Math.PI*2); ctx.fill();
    ctx.restore();

    if (!gameActive) {
        ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = "#00ff00"; ctx.textAlign = "center"; ctx.font = "bold 40px Arial";
        ctx.fillText("CRASHED!", canvas.width/2, canvas.height/2);
    }
    
    update();
    requestAnimationFrame(draw);
}
</script>
</body>
</html>
